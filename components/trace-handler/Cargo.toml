[package]
name = "trace-handler"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
# shared with the other trace components
path = "../../crates/trace/src/lib.rs"

[features]
default = ["handler"]
client = []
handler = []

[dependencies]
http-utils = { workspace = true }
# without std, see crates/wasip3-rt
wasip3-rt = { workspace = true }
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc", "async"] }

[dev-dependencies]
test-harness = { workspace = true }
tokio = { workspace = true }
wasmtime = { workspace = true }

[package.metadata.componentized]
# built for wasm32-wasip3, see build/components.mk
target = "wasm32-wasip3"
