[workspace]
resolver = "2"
members = [
    "components/client",
    "components/trace",
    "components/trace-client",
    "components/trace-handler",
    "components/trace-componentized-client",
    "components/trace-types",
    "crates/test-harness",
]

[workspace.dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
test-harness = { path = "./crates/test-harness" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
wasmtime = { version = "49", features = ["component-model-async"] }
wasmtime-wasi = { version = "49", features = ["p3"] }
wasmtime-wasi-http = { version = "49", default-features = false, features = ["p3", "component-model-async"] }
wit-bindgen = "0.62.0"
